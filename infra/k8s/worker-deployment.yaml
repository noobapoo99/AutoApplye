apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-research
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-research
  template:
    metadata:
      labels:
        app: worker-research
    spec:
      containers:
        - name: worker
          image: autoapply-api:latest
          env:
            - name: WORKER_TYPE
              value: research
          envFrom:
            - secretRef:
                name: autoapply-secrets
          resources:
            requests:
              cpu: "125m"
              memory: "256Mi"
            limits:
              cpu: "250m"
              memory: "512Mi"
---
